<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人书架</title>
    <link rel="stylesheet" href="../src/styles/main.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="masthead__kicker">PERSONAL SHELF</p>
        <h1 class="masthead__title">个人书架</h1>
        <p class="masthead__lead">记下正在读的书，以及读到了哪里。</p>
      </header>
      <section class="book-form" aria-label="上架新书">
        <h2 class="book-form__heading">上架一本新书</h2>
        <form id="book-form">
          <div class="book-form__grid">
            <label class="book-form__field">
              <span class="book-form__label">书名</span>
              <input
                class="book-form__input"
                name="title"
                type="text"
                required
                autocomplete="off"
              />
            </label>
            <label class="book-form__field">
              <span class="book-form__label">作者</span>
              <input
                class="book-form__input"
                name="author"
                type="text"
                required
                autocomplete="off"
              />
            </label>
            <label class="book-form__field">
              <span class="book-form__label">进度</span>
              <input
                class="book-form__input"
                name="progress"
                type="number"
                min="0"
                max="100"
                step="1"
                value="0"
                required
              />
            </label>
            <label class="book-form__field book-form__field--wide">
              <span class="book-form__label">读后感</span>
              <input
                class="book-form__input"
                name="note"
                type="text"
                required
                autocomplete="off"
              />
            </label>
          </div>
          <div class="book-form__actions">
            <button class="book-form__submit" type="submit">上架</button>
          </div>
        </form>
      </section>
      <nav id="book-filter" class="book-filter" aria-label="按状态筛选">
        <button
          type="button"
          class="book-filter__btn is-active"
          data-status="all"
          aria-pressed="true"
        >
          全部
        </button>
        <button
          type="button"
          class="book-filter__btn"
          data-status="queued"
          aria-pressed="false"
        >
          想读
        </button>
        <button
          type="button"
          class="book-filter__btn"
          data-status="reading"
          aria-pressed="false"
        >
          在读
        </button>
        <button
          type="button"
          class="book-filter__btn"
          data-status="finished"
          aria-pressed="false"
        >
          读完
        </button>
      </nav>
      <section id="book-list" class="book-list" aria-label="在读书单"></section>
    </main>
    <script src="../src/data/books.js"></script>
    <script src="../src/scripts/lib/book-storage.js"></script>
    <script src="../src/scripts/ui/escape-html.js"></script>
    <script src="../src/scripts/ui/book-remove.js"></script>
    <script src="../src/scripts/ui/book-card.js"></script>
    <script src="../src/scripts/ui/book-list.js"></script>
    <script src="../src/scripts/ui/book-form.js"></script>
    <script src="../src/scripts/ui/book-filter.js"></script>
    <script src="../src/scripts/home.js"></script>
  </body>
</html>
